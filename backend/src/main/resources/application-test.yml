server:
  port: 8080

spring:
  datasource:
    url: ${INFRAPULSE_TEST_DB_URL:jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1}
    username: ${INFRAPULSE_TEST_DB_USERNAME:sa}
    password: ${INFRAPULSE_TEST_DB_PASSWORD:}
    driver-class-name: ${INFRAPULSE_TEST_DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  flyway:
    enabled: false
  redis:
    host: ${INFRAPULSE_REDIS_HOST:localhost}
    port: ${INFRAPULSE_REDIS_PORT:6379}
