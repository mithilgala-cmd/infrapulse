server:
  port: 8080
  servlet:
    context-path: /api

spring:
  datasource:
    url: ${INFRAPULSE_DB_URL:jdbc:postgresql://localhost:5432/infrapulse}
    username: ${INFRAPULSE_DB_USERNAME:infrapulse}
    password: ${INFRAPULSE_DB_PASSWORD:infrapulse_dev_password}
    driver-class-name: ${INFRAPULSE_DB_DRIVER:org.postgresql.Driver}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  redis:
    host: ${INFRAPULSE_REDIS_HOST:localhost}
    port: ${INFRAPULSE_REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.infrapulse: INFO
    org.springframework: WARN
